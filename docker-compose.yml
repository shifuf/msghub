# 生产全栈：docker compose up -d --build
# 本机只起库：pnpm db:up（APP_ENV=development 时自动临时映射本机端口）
#
# postgres / redis 默认不映射宿主机端口（与博客 compose 相同）：
#   - 容器间用服务名：postgres:5432、redis:6379
#   - 不占用、不冲突宿主机已有 5432/6379
#   - 官方镜像可与其它项目并存，数据卷相互独立

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: msg
      POSTGRES_PASSWORD: msg123456
      POSTGRES_DB: msg_notify
    volumes:
      - msg_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U msg -d msg_notify']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - msg_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: unless-stopped
    environment:
      APP_ENV: production
      NODE_ENV: production
      # Docker 内固定走服务名，无需在 .env 写库地址
      DATABASE_URL: postgresql://msg:msg123456@postgres:5432/msg_notify?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?请设置随机 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请设置初始化管理员强密码}
      FORCE_RESET_ADMIN_PASSWORD: ${FORCE_RESET_ADMIN_PASSWORD:-false}
      SITE_URL: ${SITE_URL:-}
      PORT: 3010
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPERATIONS_PROJECT_ROOT: /app
    volumes:
      - type: bind
        source: ./data/backups/control
        target: /app/data/backups/control
      - type: bind
        source: ./data/backups/archives
        target: /app/data/backups/archives
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '3', '-O', '-', 'http://127.0.0.1:3010/api/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      ADMIN_PATH: ${ADMIN_PATH:-/admin}
      SITE_URL: ${SITE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8185}:80'

  backup-runner:
    profiles: ['backups']
    image: msghub-backup-runner:local
    build:
      context: .
      dockerfile: scripts/backup.Dockerfile
      args:
        APP_COMMIT: ${APP_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      PROJECT_ROOT: /project
      BACKUP_KEY_FILE: /run/secrets/msghub_backup_key
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: msg
      PGDATABASE: msg_notify
      PGPASSWORD: msg123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - type: bind
        source: ./data/backups
        target: /project/data/backups
      - type: bind
        source: ./.env
        target: /project/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-compose.yml
        target: /project/docker-compose.yml
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - msghub_backup_key
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${BACKUP_VERIFY_TMPFS_SIZE:-2g},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

secrets:
  msghub_backup_key:
    file: ${BACKUP_AGE_IDENTITY_FILE:-./data/backup-secrets/identity.txt}

volumes:
  msg_pg_data:
  msg_redis_data:
